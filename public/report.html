<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapportage - Marketing Studio</title>
<style>
:root{--ink:#1a1d27;--mid:#565b6b;--muted:#8a8f9e;--line:#e5e7ee;--soft:#f6f7fa;--brand:#6366f1;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:#eceef3;color:var(--ink);line-height:1.55}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.bar .t{font-size:14px;color:var(--mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit}
.btn-print{background:var(--brand);color:#fff}
.page{max-width:1100px;margin:24px auto;background:#fff;padding:44px 48px;box-shadow:0 6px 30px rgba(0,0,0,.10);border-radius:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:20px;margin-bottom:26px}
.head .badge{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
.head h1{font-size:26px;letter-spacing:-.02em}
.head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.head .right{text-align:right;font-size:12px;color:var(--muted)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin:32px 0 14px}
.sect1{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:700;margin-top:3px}
.up{color:#16a34a}.down{color:#dc2626}
/* Gekleurde community-tegels */
.big{border-radius:14px;padding:20px 22px;color:var(--ink)}
.big .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.big .d{font-size:13px;font-weight:700;margin-top:4px}
.big .k{font-size:13px;font-weight:600;margin-top:10px}
.c-purple{background:#e7e7fb}.c-green{background:#dcf5e7}.c-amber{background:#fdecc8}
/* Contenttype-balken */
.ctbar{margin-bottom:11px}
.ctbar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.ctbar .track{height:9px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctbar .fill{height:100%;background:var(--brand)}
/* Posts-ranglijst */
.tbl-wrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-size:12.5px}
table.rank th{text-align:right;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.rank th.l,table.rank td.l{text-align:left}
table.rank td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
table.rank td.l{text-align:left}
.pthumb{width:42px;height:42px;border-radius:7px;object-fit:cover;background:var(--soft);display:block}
.ptxt{max-width:230px;font-size:12.5px;line-height:1.4}
.pdate{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--mid)}
.row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .m{min-width:0;flex:1}.row .m h4{font-size:14px;margin-bottom:2px}.row .m .s{font-size:12px;color:var(--muted)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:11px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.note{color:var(--muted);font-size:12px;margin-top:8px}
@media print{
  body{background:#fff}
  .bar{display:none}
  .page{box-shadow:none;margin:0;max-width:none;padding:0 10px}
  h2{break-after:avoid}
  .row,.kpi,.big,table.rank tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="bar">
  <div class="t">Rapportage</div>
  <button class="btn btn-print" onclick="window.print()">Download als PDF</button>
</div>
<div class="page" id="page"><div class="empty" style="padding:40px">Rapport laden...</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase()||'?';}
function fmtWhen(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d.getTime()))return '';return d.toLocaleString('nl-NL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtDay(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d.getTime()))return '';return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});}
function num(v){return v!=null?v:'-';}
function fmtn(v){return v!=null?Number(v).toLocaleString('nl-NL'):'-';}
function statusLabel(st){if(!st)return 'Onbekend';st=String(st);if(st==='ACTIVE')return 'Live';if(/PAUSED/.test(st))return 'Gepauzeerd';if(st==='ARCHIVED')return 'Gearchiveerd';if(st==='DELETED')return 'Verwijderd';return st.charAt(0)+st.slice(1).toLowerCase().replace(/_/g,' ');}
function statusBadge(live,st){var col=live?'color:#166534;background:#dcfce7':'color:#92400e;background:#fef3c7';return '<span style="font-size:10px;font-weight:700;'+col+';padding:2px 8px;border-radius:20px;margin-left:6px;white-space:nowrap">'+esc(live?'LIVE':statusLabel(st))+'</span>';}
function param(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):'';}
var CID=param('client');
var TYPE_LABELS={IMAGE:'Bericht',CAROUSEL_ALBUM:'Carrousel',VIDEO:'Video',REELS:'Reel',ONBEKEND:'Overig'};

function kpi(k,v){return '<div class="kpi"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function bigtile(cls,label,val,delta,deltaUp){
  var d=delta?('<div class="d '+(deltaUp?'up':'down')+'">'+esc(delta)+'</div>'):'';
  return '<div class="big '+cls+'"><div class="v">'+esc(val)+'</div>'+d+'<div class="k">'+esc(label)+'</div></div>';
}
async function jget(url){try{var r=await fetch(url,{credentials:'include'});if(!r.ok)return null;return await r.json();}catch(e){return null;}}

async function build(){
  var page=document.getElementById('page');
  if(!CID){page.innerHTML='<div class="empty" style="padding:40px">Geen klant opgegeven.</div>';return;}
  var cd=await jget('/api/mkt/clients/'+CID);
  if(!cd||!cd.success){page.innerHTML='<div class="empty" style="padding:40px">Kon dit rapport niet laden. Ben je ingelogd?</div>';return;}
  var c=cd.client, col=c.brand_color||'#6366f1';
  document.documentElement.style.setProperty('--brand',col);

  var meta=await jget('/api/mkt/clients/'+CID+'/meta-insights');
  var camps=await jget('/api/mkt/clients/'+CID+'/meta-campaigns');
  // Alleen de campagnes die aan DEZE klant zijn gekoppeld (geen datalek).
  var links=await jget('/api/mkt/clients/'+CID+'/campaign-links');
  var linkedIds=(links&&links.success&&links.links)?links.links.map(String):[];

  var html='';
  html+='<div class="head"><div style="display:flex;gap:16px;align-items:center">'+
    '<div class="badge" style="background:'+esc(col)+'">'+esc(initials(c.name))+'</div>'+
    '<div><h1>'+esc(c.name)+'</h1><div class="sub">Marketingrapportage · laatste 28 dagen</div></div></div>'+
    '<div class="right">Gegenereerd op<br>'+esc(new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}))+'</div></div>';

  var hasMeta=meta&&meta.success&&meta.configured;

  if(hasMeta&&meta.account){
    var acc=meta.account, ins=meta.insights||{};
    // Community growth (gekleurde tegels)
    var followers=acc.followers, delta=ins.follower_delta;
    var growthPct=null;
    if(delta!=null&&followers!=null&&(followers-delta)>0){growthPct=Math.round((delta/(followers-delta))*10000)/100;}
    html+='<h2>Community growth</h2>';
    if(acc.username)html+='<div class="sect1">@'+esc(acc.username)+'</div>';
    html+='<div class="grid g3">'+
      bigtile('c-purple','Volgers',fmtn(followers),growthPct!=null?((growthPct>=0?'+':'')+growthPct+'%'):'',growthPct==null||growthPct>=0)+
      bigtile('c-green','Volgersbalans (28d)',(delta!=null?((delta>=0?'+':'')+fmtn(delta)):'-'),'',delta==null||delta>=0)+
      bigtile('c-amber','Berichten totaal',fmtn(acc.media),'',true)+
      '</div>';

    // Instagram statistieken
    var ik=[];
    if(ins.reach!=null)ik.push(kpi('Bereik',fmtn(ins.reach)));
    if(ins.views!=null)ik.push(kpi('Weergaven',fmtn(ins.views)));
    if(ins.total_interactions!=null)ik.push(kpi('Interacties',fmtn(ins.total_interactions)));
    if(ins.accounts_engaged!=null)ik.push(kpi('Betrokken accounts',fmtn(ins.accounts_engaged)));
    if(ins.profile_views!=null)ik.push(kpi('Profielbezoeken',fmtn(ins.profile_views)));
    if(acc.following!=null)ik.push(kpi('Volgend',fmtn(acc.following)));
    if(ik.length)html+='<h2>Instagram statistieken</h2><div class="sect1">laatste 28 dagen</div><div class="grid">'+ik.join('')+'</div>';
    else html+='<div class="note">Statistieken (bereik, weergaven, interacties) zijn nog niet beschikbaar.'+((meta.errors&&meta.errors.insights)?(' Meta-melding: '+esc(meta.errors.insights)):'')+'</div>';

    // Verdeling per contenttype
    if(meta.contentTypes&&meta.contentTypes.length){
      var mx=Math.max.apply(null,meta.contentTypes.map(function(x){return x.count;}))||1;
      html+='<h2>Verdeling per contenttype</h2>';
      html+=meta.contentTypes.map(function(x){
        var w=Math.round((x.count/mx)*100);
        return '<div class="ctbar"><div class="lab"><span>'+esc(TYPE_LABELS[x.type]||x.type)+'</span><span style="color:var(--muted)">'+x.count+' posts · '+fmtn(x.interactions)+' interacties</span></div>'+
          '<div class="track"><div class="fill" style="width:'+w+'%"></div></div></div>';
      }).join('');
    }

    // Ranking of posts (met per-post cijfers)
    if(meta.topPosts&&meta.topPosts.length){
      html+='<h2>Ranking of posts</h2><div class="sect1">'+meta.topPosts.length+' best presterende posts</div>';
      html+='<div class="tbl-wrap"><table class="rank"><tr>'+
        '<th class="l">Datum</th><th class="l">Type</th><th class="l">Tekst</th>'+
        '<th>Weergaven</th><th>Bereik</th><th>Likes</th><th>Reacties</th><th>Opgeslagen</th><th>Gedeeld</th><th>Engagement</th></tr>';
      html+=meta.topPosts.map(function(p){
        var img=p.thumb?('<img class="pthumb" src="'+esc(p.thumb)+'" alt="">'):'<div class="pthumb"></div>';
        var link=p.permalink?('<a href="'+esc(p.permalink)+'" target="_blank" style="color:var(--brand);font-size:11px">bekijk</a>'):'';
        return '<tr>'+
          '<td class="l"><div class="pdate">'+esc(fmtDay(p.timestamp))+'</div>'+link+'</td>'+
          '<td class="l">'+img+'<div style="font-size:11px;color:var(--muted);margin-top:3px">'+esc(TYPE_LABELS[p.media_type]||p.media_type||'')+'</div></td>'+
          '<td class="l"><div class="ptxt">'+esc((p.caption||'(geen tekst)'))+'</div></td>'+
          '<td>'+fmtn(p.views)+'</td>'+
          '<td>'+fmtn(p.reach)+'</td>'+
          '<td>'+fmtn(p.likes)+'</td>'+
          '<td>'+fmtn(p.comments)+'</td>'+
          '<td>'+fmtn(p.saved)+'</td>'+
          '<td>'+fmtn(p.shares)+'</td>'+
          '<td>'+(p.engagement!=null?(p.engagement+'%'):'-')+'</td>'+
        '</tr>';
      }).join('');
      html+='</table></div>';
    }

  }

  // Advertenties (samenvatting voor DEZE klant, ook zonder Instagram-koppeling)
  if(meta&&meta.ads&&!meta.ads.empty){
    var adTiles=kpi('Uitgaven','€ '+num(meta.ads.spend))+kpi('Impressies',fmtn(meta.ads.impressions))+kpi('Bereik',fmtn(meta.ads.reach))+kpi('Klikken',fmtn(meta.ads.clicks))+kpi('CTR',num(meta.ads.ctr)+'%')+kpi('CPC','€ '+num(meta.ads.cpc));
    if(meta.ads.results!=null){adTiles+=kpi('Leads',fmtn(meta.ads.results))+kpi('Kosten per lead',meta.ads.cost_per_result!=null?('€ '+num(meta.ads.cost_per_result)):'-');}
    html+='<h2>Advertenties</h2><div class="sect1">laatste 30 dagen, alleen campagnes van deze klant</div><div class="grid">'+adTiles+'</div>';
  }

  // Campagnes op Meta met ad sets en advertenties (alleen gekoppeld aan deze klant)
  var shownCamps=(camps&&camps.success&&camps.configured&&camps.campaigns)?camps.campaigns.filter(function(x){return linkedIds.indexOf(String(x.id))>=0;}):[];
  var campMeta={}; shownCamps.forEach(function(c2){campMeta[String(c2.id)]={name:c2.name,objective:c2.objective,status:c2.status,budget:c2.budget,budget_type:c2.budget_type};});
  var tree=(meta&&meta.adTree)?meta.adTree:[];
  if(tree.length){
    html+='<h2>Campagnes op Meta</h2><div class="sect1">laatste 30 dagen, per campagne, ad set en advertentie</div>';
    html+=tree.map(function(c){
      var cm=campMeta[String(c.id)]||{};
      var nSets=(c.adsets||[]).length, nLive=c.live_adsets||0;
      var head='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div><h4 style="font-size:15px">'+esc(cm.name||'Campagne')+'</h4><div class="s">'+esc(cm.objective||'')+(cm.status?(' · '+esc(cm.status)):'')+(cm.budget!=null?(' · € '+Number(cm.budget).toFixed(2)+'/'+esc(cm.budget_type||'')):'')+'</div><div class="s" style="margin-top:3px;font-weight:600">'+nSets+' ad sets · '+nLive+' live</div></div>'+
        '<div class="s" style="text-align:right">€ '+num(c.spend)+' · '+fmtn(c.impressions)+' impr · '+fmtn(c.clicks)+' klikken · CTR '+num(c.ctr)+'%'+(c.results!=null?(' · '+fmtn(c.results)+' leads'+(c.cost_per_result!=null?(' (€ '+num(c.cost_per_result)+'/lead)'):'')):'')+'</div></div>';
      var setRows=(c.adsets||[]).map(function(s){
        var adLines=(s.ads||[]).map(function(a){
          return '<tr><td class="l" style="padding-left:18px;color:var(--muted)">&#8627; '+esc(a.name||'Advertentie')+statusBadge(a.live,a.status)+'</td><td>&euro; '+num(a.spend)+'</td><td>'+fmtn(a.impressions)+'</td><td>'+fmtn(a.reach)+'</td><td>'+fmtn(a.clicks)+'</td><td>'+num(a.ctr)+'%</td><td>'+(a.results!=null?fmtn(a.results):'-')+'</td><td>'+(a.cost_per_result!=null?('&euro; '+num(a.cost_per_result)):'-')+'</td></tr>';
        }).join('');
        return '<tr><td class="l"><strong>'+esc(s.name||'Ad set')+'</strong>'+statusBadge(s.live,s.status)+'</td><td>&euro; '+num(s.spend)+'</td><td>'+fmtn(s.impressions)+'</td><td>'+fmtn(s.reach)+'</td><td>'+fmtn(s.clicks)+'</td><td>'+num(s.ctr)+'%</td><td>'+(s.results!=null?fmtn(s.results):'-')+'</td><td>'+(s.cost_per_result!=null?('&euro; '+num(s.cost_per_result)):'-')+'</td></tr>'+adLines;
      }).join('');
      var table=setRows?('<div class="tbl-wrap"><table class="rank"><tr><th class="l">Ad set / advertentie</th><th>Uitgaven</th><th>Impressies</th><th>Bereik</th><th>Klikken</th><th>CTR</th><th>Leads</th><th>Kosten/lead</th></tr>'+setRows+'</table></div>'):'<div class="s" style="color:var(--muted)">Nog geen ad sets met data in deze periode.</div>';
      return '<div class="row" style="display:block">'+head+table+'</div>';
    }).join('');
  } else if(shownCamps.length){
    html+='<h2>Campagnes op Meta</h2><div class="sect1">laatste 30 dagen</div>';
    html+=shownCamps.map(function(c2){
      var b=c2.budget!=null?(' · € '+c2.budget.toFixed(2)+'/'+(c2.budget_type||'')):'';
      var stats='';
      if(c2.spend!=null||c2.impressions!=null){
        stats='<div class="s" style="margin-top:6px">€ '+num(c2.spend)+' uitgegeven · '+fmtn(c2.impressions)+' impressies · '+fmtn(c2.reach)+' bereik · '+fmtn(c2.clicks)+' klikken · CTR '+num(c2.ctr)+'%</div>';
      }
      return '<div class="row"><div class="m"><h4>'+esc(c2.name)+'</h4><div class="s">'+esc(c2.objective||'')+' · '+esc(c2.status||'')+b+'</div>'+stats+'</div></div>';
    }).join('');
  }

  // Als er voor deze klant helemaal niets is
  if(!(hasMeta&&meta.account)&&!(meta&&meta.ads&&!meta.ads.empty)&&!shownCamps.length){
    html+='<h2>Nog geen data</h2><div class="note">Voor deze klant is nog geen Instagram-koppeling of gekoppelde advertentiecampagne ingesteld. Koppel in de Koppelingen een Instagram-account, of koppel via "Campagnes koppelen" de campagnes die bij deze klant horen.</div>';
  }

  html+='<div class="foot">Marketing Studio · Powered by Dynamic Health Consultancy</div>';
  page.innerHTML=html;
}
build();
</script>
</body>
</html>
